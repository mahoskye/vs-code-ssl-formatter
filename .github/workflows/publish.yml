name: Publish Extension

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    # Pre-releases are for testing; only a full release may publish.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false

    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Verify tag matches package.json version
      if: github.event_name == 'release'
      run: |
        TAG="${{ github.event.release.tag_name }}"
        PKG_VERSION="$(node -p "require('./package.json').version")"
        if [ "$TAG" != "v$PKG_VERSION" ]; then
          echo "::error::Release tag $TAG does not match package.json version v$PKG_VERSION — refusing to publish."
          exit 1
        fi

    - name: Run tests
      run: |
        npm run lint
        npm run compile
        npm run test:unit

    - name: Package all platform targets
      run: node scripts/package-platforms.mjs

    - name: Smoke-test the linux-x64 package
      uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1
      with:
        run: node scripts/smoke-vsix.mjs linux-x64

    - name: Publish tested packages to VS Code Marketplace
      if: github.event_name == 'release'
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
      run: npx vsce publish --packagePath dist-vsix/*.vsix

    - name: Upload VSIX artifacts (manual dispatch)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      with:
        name: ssl-extension-manual
        path: 'dist-vsix/*.vsix'
