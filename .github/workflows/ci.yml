name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} with Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]

    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Setup Node.js ${{ matrix.node }}
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: ${{ matrix.node }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Compile TypeScript
      run: npm run compile

    - name: Run unit tests
      run: npm run test:unit

    - name: Run integration tests (Linux, under xvfb)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
        xvfb-run --auto-servernum npm run test:integration

    - name: Run integration tests (macOS/Windows)
      if: runner.os != 'Linux'
      run: npm run test:integration

    # TEMPORARY (issue #92): diagnose the macOS ENOENT on the extracted VS Code app
    - name: Debug .vscode-test layout on failure (macOS)
      if: failure() && runner.os == 'macOS'
      run: |
        which unzip && unzip -v | head -2
        ls -la .vscode-test/ || true
        for d in .vscode-test/vscode-darwin-*; do
          echo "== $d =="
          ls -la "$d" || true
          ls -la "$d/Visual Studio Code.app/Contents/MacOS/" || true
          find "$d" -maxdepth 3 -print | head -40
        done

    - name: Check for console.log in production code
      if: runner.os == 'Linux'
      run: |
        if grep -r "console\.log" src/ --include="*.ts" --exclude="**/logger.ts"; then
          echo "❌ Found console.log in production code!"
          exit 1
        else
          echo "✅ No console.log found in production code"
        fi

    - name: Check for TODO comments
      if: runner.os == 'Linux'
      run: |
        if grep -r "TODO\|FIXME\|XXX\|HACK" src/ --include="*.ts"; then
          echo "⚠️  Found TODO/FIXME comments in code"
          # Don't fail, just warn
        else
          echo "✅ No TODO/FIXME comments found"
        fi

  package:
    name: Package Extension
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Package all platform targets
      run: node scripts/package-platforms.mjs

    - name: Smoke-test the linux-x64 package
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
        xvfb-run --auto-servernum node scripts/smoke-vsix.mjs linux-x64

    - name: Upload VSIX artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ssl-extension-${{ github.sha }}
        path: 'dist-vsix/*.vsix'
        retention-days: 30
