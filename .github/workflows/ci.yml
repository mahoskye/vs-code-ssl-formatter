name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} with Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]

    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Setup Node.js ${{ matrix.node }}
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: ${{ matrix.node }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Compile TypeScript
      run: npm run compile

    - name: Run unit tests
      run: npm run test:unit

    - name: Run integration tests
      uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1
      with:
        run: npm run test:integration

    - name: Check for console.log in production code
      if: runner.os == 'Linux'
      run: |
        if grep -r "console\.log" src/ --include="*.ts" --exclude="**/logger.ts"; then
          echo "❌ Found console.log in production code!"
          exit 1
        else
          echo "✅ No console.log found in production code"
        fi

    - name: Check for TODO comments
      if: runner.os == 'Linux'
      run: |
        if grep -r "TODO\|FIXME\|XXX\|HACK" src/ --include="*.ts"; then
          echo "⚠️  Found TODO/FIXME comments in code"
          # Don't fail, just warn
        else
          echo "✅ No TODO/FIXME comments found"
        fi

  package:
    name: Package Extension
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Package all platform targets
      run: node scripts/package-platforms.mjs

    - name: Smoke-test the linux-x64 package
      uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1
      with:
        run: node scripts/smoke-vsix.mjs linux-x64

    - name: Upload VSIX artifacts
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      with:
        name: ssl-extension-${{ github.sha }}
        path: 'dist-vsix/*.vsix'
        retention-days: 30
